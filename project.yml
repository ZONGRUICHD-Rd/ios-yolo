name: YOLOApp
options:
  bundleIdPrefix: com.github.iosyolo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YOLOApp:
    type: application
    platform: iOS
    sources:
      - path: YOLOApp/Sources
      # Compiled .mlmodelc bundles produced by CI; copied as-is into YOLOApp.app/Models
      - path: Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.iosyolo.app
        PRODUCT_NAME: YOLOApp
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: YOLOApp/Info.plist
      properties:
        CFBundleDisplayName: YOLO26
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 需要使用相机进行实时目标检测
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    scheme: {}
